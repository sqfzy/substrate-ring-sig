[package]
name = "crypto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

# 密码学库 (与后端保持一致)
curve25519-dalek = { version = "4.1", default-features = false, features = [
  "serde",
] }
nazgul = { version = "2.1", default-features = false, features = ["no_std"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"

# WASM 优化
console_error_panic_hook = "0.1"
wee_alloc = "0.4"
js-sys = "0.3.85"
rand_chacha = "0.3.1"
serde_json = "1.0.149"
rand = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
wasm-bindgen-test = "0.3"

[[bench]]
name = "blsag"
harness = false # 必须关闭，使用 criterion 自己的 harness

# [profile.release]
# opt-level = "z"
# lto = true
